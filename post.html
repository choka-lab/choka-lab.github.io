<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今週末の投稿画像｜釣果ラボ</title>
<meta name="description" content="今週末の堤防予報を、SNS に投稿できる画像と文章にまとめます。">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><img src="img/icon.svg" alt="" width="40" height="40"><div><h1>今週末の投稿画像</h1>
  <p>開くたびに最新の予報で、投稿用の画像と文章を作ります　<a href="./">← 堤防予報へ</a></p></div></div>
</header>
<main>
  <section class="card">
    <div class="row">
      <div><label for="spot">釣り場の地域</label><select id="spot"></select></div>
      <div><label for="fish">狙い（魚・釣り方）</label><select id="fish"></select></div>
    </div>
    <div id="custom" class="row hide" style="margin-top:10px">
      <div><label for="lat">緯度</label><input id="lat" type="number" step="0.01"></div>
      <div><label for="lon">経度</label><input id="lon" type="number" step="0.01"></div>
    </div>
    <div class="btns"><button class="btn" id="make">作り直す</button></div>
  </section>

  <div id="status">今週末の予報を取り寄せています…</div>

  <section class="card hide" id="out">
    <canvas id="cv" width="1080" height="1350" class="preview" role="img" aria-label="今週末の堤防予報の画像"></canvas>
    <div class="btns" style="justify-content:center">
      <button class="btn" id="share">📤 画像と文章を共有</button>
      <button class="btn sub" id="save">画像を保存</button>
    </div>
    <p class="hint" style="text-align:center">スマホでは「共有」から X や Instagram を選べます。うまくいかないときは「画像を保存」と「文章をコピー」を使ってください。</p>
    <label for="text" style="margin-top:12px">投稿の文章</label>
    <textarea id="text"></textarea>
    <div class="btns"><button class="btn sub" id="copy">文章をコピー</button></div>
  </section>
</main>
<footer>
  <p>予報は Open-Meteo.com の気象・海況データ（CC BY 4.0）から作っています。予報なので、出かける前に最新の天気と現地の状況を確かめてください。</p>
</footer>

<script src="forecast.js"></script>
<script>
(function(){
"use strict";
const {SPOTS,FISH,GRADE,store,md,hm,getData,analyze,spotLatLon} = window.ChokaLab;
const $ = id => document.getElementById(id);
SPOTS.forEach((s,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=s[0]; $("spot").appendChild(o); });
FISH.forEach((f,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=f.name; $("fish").appendChild(o); });
$("spot").value = store.get("spot", 0);
$("fish").value = store.get("fish", 0);
$("lat").value = store.get("lat", "");
$("lon").value = store.get("lon", "");
const toggleCustom=()=>$("custom").classList.toggle("hide", SPOTS[+$("spot").value][1]!==null);
toggleCustom();
$("spot").addEventListener("change", ()=>{ toggleCustom(); make(); });
$("fish").addEventListener("change", make);
$("make").addEventListener("click", make);

// 今週末（土・日）。今日が日曜なら今日だけ
function weekendDates(){
  const t=new Date(); const dow=t.getDay(); const out=[];
  const add=n=>{ const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+n); out.push(window.ChokaLab.ymd(d)); };
  if(dow===0){ add(0); } else if(dow===6){ add(0); add(1); } else { add(6-dow); add(7-dow); }
  return out;
}

const COL={s:"#0f8a5f",a:"#2f7fbf",b:"#c78a00",c:"#c0392b"};
const FONT='"Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif';
let icon=null;
const iconImg=new Image(); iconImg.onload=()=>{icon=iconImg;}; iconImg.src="img/icon.svg";

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fitText(ctx,txt,max,size,weight){ let s=size; do{ ctx.font=`${weight} ${s}px ${FONT}`; s-=2; }while(ctx.measureText(txt).width>max && s>18); }

function draw(days, spot, fish, hasTide){
  const cv=$("cv"), ctx=cv.getContext("2d"), W=1080, H=1350;
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#1680bf"); g.addColorStop(0.5,"#0b5c8c"); g.addColorStop(1,"#062c44");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 波
  ctx.fillStyle="rgba(255,255,255,.08)"; ctx.beginPath(); ctx.moveTo(0,1230);
  for(let x=0;x<=W;x+=10) ctx.lineTo(x,1230+Math.sin(x/90)*16); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
  // 見出し
  if(icon){ ctx.save(); rr(ctx,60,58,96,96,22); ctx.clip(); ctx.drawImage(icon,60,58,96,96); ctx.restore(); }
  ctx.fillStyle="#fff"; ctx.textBaseline="alphabetic";
  ctx.font=`800 64px ${FONT}`; ctx.fillText("今週末の堤防予報",180,122);
  ctx.font=`600 30px ${FONT}`; ctx.globalAlpha=.9; fitText(ctx, spot+"　／　"+fish.name, 820, 32, 600); ctx.fillText(spot+"　／　"+fish.name,180,166); ctx.globalAlpha=1;

  // 日ごとのカード
  const top=200, gap=30, n=Math.max(1,days.length), ch=(1180-top-gap*(n-1))/n;
  days.forEach((d,i)=>{
    const y=top+i*(ch+gap), x=60, w=W-120;
    ctx.fillStyle="#ffffff"; rr(ctx,x,y,w,ch,36); ctx.fill();
    const {txt,w:wd}=md(d.date); const G=GRADE[d.grade]; const b=d.best;
    // 判定マーク
    ctx.fillStyle=COL[d.grade]; rr(ctx,x+36,y+40,200,200,40); ctx.fill();
    ctx.fillStyle="#fff"; ctx.textAlign="center";
    ctx.font=`800 120px ${FONT}`; ctx.fillText(G[0],x+136,y+170);
    ctx.font=`700 34px ${FONT}`; ctx.fillText(G[1],x+136,y+222);
    ctx.textAlign="left";
    // 日付と潮
    ctx.fillStyle= wd===6?"#2f6fd0": wd===0?"#c0392b":"#14212b";
    ctx.font=`800 62px ${FONT}`; ctx.fillText(txt,x+270,y+104);
    const dw=ctx.measureText(txt).width;
    ctx.fillStyle="#e3f0f8"; rr(ctx,x+290+dw,y+56,120,60,30); ctx.fill();
    ctx.fillStyle="#0b5c8c"; ctx.font=`800 34px ${FONT}`; ctx.fillText(d.tn,x+308+dw,y+98);
    // 狙う時間
    ctx.fillStyle="#14212b";
    const bestTxt = d.allStop ? "やめとけ："+b.stop[0] : `${hm(b.s)}〜${hm(b.e)}`;
    const bestSub = d.allStop ? "" : b.label+(b.trend?"・"+b.trend:"");
    if(d.allStop){ ctx.fillStyle="#c0392b"; fitText(ctx,bestTxt,w-310,46,800); ctx.fillText(bestTxt,x+270,y+180); }
    else { ctx.font=`800 52px ${FONT}`; ctx.fillText(bestTxt,x+270,y+178);
      ctx.fillStyle="#0b5c8c"; ctx.font=`700 36px ${FONT}`; ctx.fillText(bestSub,x+270,y+228); }
    // 細目
    const hi=d.hiLo.filter(z=>z.hi).map(z=>hm(z.m)).join("・")||"—";
    const lo=d.hiLo.filter(z=>!z.hi).map(z=>hm(z.m)).join("・")||"—";
    const facts=[
      ["満潮", hasTide?hi:"—"], ["干潮", hasTide?lo:"—"],
      ["風", `${b.dir} ${b.wind.toFixed(0)}m/s`], ["波", b.wave===null?"—":b.wave.toFixed(1)+"m"],
      ["雨", b.rain<0.2?"なし":b.rain.toFixed(1)+"mm"], ["日の出", hm(d.sr)]
    ];
    // 1段目：満潮・干潮（2列）、2段目：風・波・雨・日の出（4列）
    const fy=y+Math.max(300, ch-150);
    facts.forEach((f,j)=>{
      const row = j<2 ? 0 : 1, cols = row===0 ? 2 : 4, k = row===0 ? j : j-2;
      const colW=(w-72)/cols, cx=x+36+k*colW, cy=fy+row*64;
      ctx.fillStyle="#5a6b78"; ctx.font=`600 28px ${FONT}`; ctx.fillText(f[0],cx,cy);
      const lw=ctx.measureText(f[0]).width+12;
      ctx.fillStyle="#14212b"; fitText(ctx,f[1],colW-lw-16,34,800);
      ctx.fillText(f[1],cx+lw,cy); });
  });
  // フッター
  ctx.fillStyle="#fff"; ctx.globalAlpha=.92; ctx.font=`700 32px ${FONT}`; ctx.textAlign="left";
  ctx.fillText("予報ツール  choka-lab.github.io",60,1292);
  ctx.textAlign="right"; ctx.fillText("@choka_lab",W-60,1292); ctx.textAlign="left"; ctx.globalAlpha=1;
  ctx.font=`500 22px ${FONT}`; ctx.globalAlpha=.7; ctx.fillText("※予報です。現地の状況と安全を優先してください　データ：Open-Meteo.com",60,1330); ctx.globalAlpha=1;
}

function postText(days, spot, fish){
  const lines=days.map(d=>{ const {txt}=md(d.date); const g=GRADE[d.grade][0]; const b=d.best;
    return d.allStop ? `${txt} ${g}${d.tn}　やめとけ（${b.stop[0]}）` : `${txt} ${g}${d.tn}　${hm(b.s)}〜${hm(b.e)} ${b.label}${b.trend?"・"+b.trend:""}　風${b.wind.toFixed(0)}m`; });
  const best=days.filter(d=>d.grade!=="c").sort((a,b)=>b.best.score-a.best.score)[0];
  const lead = best ? `行くなら${md(best.date).txt}の${best.best.label}！` : "今週末は無理せず、来週に期待…";
  return `【今週末の堤防予報】${spot}／${fish.name}\n${lead}\n\n${lines.join("\n")}\n\n◎行くべき ○いい日 △微妙 ×やめとけ\n予報ツール→ https://choka-lab.github.io/\n#釣果ラボ #堤防釣り ${fish.tags} #釣り好きな人と繋がりたい`;
}

let lastBlob=null;
async function make(){
  const si=+$("spot").value, fi=+$("fish").value;
  store.set("spot",si); store.set("fish",fi);
  const ll=spotLatLon(si,$("lat").value,$("lon").value);
  if(!ll){ $("status").textContent="緯度・経度を数字で入れてください。"; return; }
  $("status").textContent="今週末の予報を取り寄せています…"; $("make").disabled=true;
  try{
    const res=analyze(await getData(ll[0],ll[1]), FISH[fi]);
    const want=weekendDates(); const days=res.days.filter(d=>want.includes(d.date));
    if(!days.length) throw new Error("no days");
    const spot=SPOTS[si][1]===null?"指定の地点":SPOTS[si][0].replace("・"," ");
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    draw(days, spot, FISH[fi], res.hasTide);
    $("text").value=postText(days, spot, FISH[fi]);
    $("out").classList.remove("hide");
    $("status").textContent="できました。内容を確かめてから投稿してください。";
    lastBlob=await new Promise(r=>$("cv").toBlob(r,"image/png"));
  }catch(e){
    $("status").textContent="予報を取得できませんでした。電波のよい所で「作り直す」を押してください。";
  }finally{ $("make").disabled=false; }
}

function fileName(){ return "choka-lab_"+new Date().toISOString().slice(0,10)+".png"; }
$("share").addEventListener("click", async ()=>{
  if(!lastBlob) return;
  const file=new File([lastBlob], fileName(), {type:"image/png"});
  const data={files:[file], text:$("text").value};
  try{
    if(navigator.canShare && navigator.canShare(data)){ await navigator.share(data); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  $("status").textContent="この端末では共有が使えません。「画像を保存」と「文章をコピー」を使ってください。";
});
$("save").addEventListener("click", ()=>{
  if(!lastBlob) return;
  const a=document.createElement("a"); a.href=URL.createObjectURL(lastBlob); a.download=fileName(); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});
$("copy").addEventListener("click", async ()=>{
  const t=$("text"); try{ await navigator.clipboard.writeText(t.value); }catch(e){ t.select(); try{document.execCommand("copy");}catch(_){} }
  $("copy").textContent="コピーしました"; setTimeout(()=>{$("copy").textContent="文章をコピー";},1500);
});
// アイコンを読み込んでから作る
if(iconImg.complete) make(); else { iconImg.onload=()=>{icon=iconImg; make();}; iconImg.onerror=make; }
})();
</script>
</body>
</html>
